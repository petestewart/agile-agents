name: CI

on:
  push:
  pull_request:

jobs:
  build-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The Playwright e2e tests (feed + control room) fail loudly when no
      # Chromium is installed, rather than skipping — a skipped SPA suite
      # reported as green is a false green. This step is what makes them run.
      - name: Install Chromium for the Playwright e2e tests
        run: bunx playwright-core install --with-deps chromium

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # No vendor login exists on CI, so this must pass without one. It runs
      # with AGILE_LIVE unset, so nothing here spawns a vendor session.
      - name: Integration tests (no vendor spawning)
        run: bun run test:integration
